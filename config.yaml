# Behavior Configuration for Screen Recorder Bot
# All timing values in seconds unless otherwise specified

timing:
  # Watch duration - Loggy3 requires ~130-second recording segments
  watch_duration_mean: 130        # ~2 min 10 s average (as per Loggy3 workflow)
  watch_duration_std: 5           # ±5 seconds standard deviation
  
  # Cooldown period between cycles
  cooldown_mean: 3.0
  cooldown_std: 1.0
  
  # Click mechanics
  click_duration_mean: 0.1        # Mouse button held down
  click_duration_std: 0.03
  
  # Pre-click hover
  hover_duration_mean: 0.4
  hover_duration_std: 0.15
  
  # Post-click stillness
  post_click_pause_mean: 0.2
  post_click_pause_std: 0.1
  
  # Window switch delay
  window_switch_delay_mean: 1.5
  window_switch_delay_std: 0.4

behavior:
  # Overshoot correction
  overshoot_probability: 0.20     # 20% chance per movement
  overshoot_distance_min: 3       # pixels
  overshoot_distance_max: 8       # pixels
  overshoot_correction_speed: 0.6 # slower than main movement
  
  # Micro-distractions during watch phase
  micro_distraction_probability: 0.25  # 25% chance per check
  micro_distraction_interval: 30       # check every 30 seconds
  
  # Bio-breaks (long pauses)
  bio_break_after_cycles_min: 6
  bio_break_after_cycles_max: 9
  bio_break_duration_min: 240     # 4 minutes
  bio_break_duration_max: 720     # 12 minutes
  bio_break_probability: 0.75     # 75% chance when in range
  
  # Micro-action types and probabilities (must sum to 1.0)
  micro_actions:
    idle_scroll: 0.35             # Small mouse wheel movement
    cursor_drift: 0.25            # Slow positional shift
    tab_focus_shift: 0.15         # Fake Alt+Tab (no switch)
    micro_pause: 0.15             # Complete stillness
    hand_readjust: 0.10           # Slight repositioning

cursor:
  # Movement physics
  speed_multiplier: 1.0           # 1.0 = normal, 0.5 = slow, 2.0 = fast
  bezier_control_points: 3        # Number of curve control points
  movement_fps: 60                # Samples per second for smooth movement
  
  # Natural jitter/tremor
  jitter_amplitude: 1.5           # pixels
  jitter_frequency: 0.1           # probability per frame
  
  # Acceleration profile
  ease_in_duration: 0.2           # seconds to reach full speed
  ease_out_duration: 0.3          # seconds to decelerate

fatigue:
  # Simulate human tiredness over time
  enabled: true
  start_after_minutes: 30         # Begin fatigue after 30 min
  max_performance_degradation: 0.15  # 15% slower at peak fatigue
  gradual_onset: true             # Smooth increase vs instant
  affects_overshoot: true         # More overshoots when fatigued
  affects_timing: true            # Slower reactions when fatigued

safety:
  # Runtime limits
  max_runtime_hours: 4            # Auto-stop after 4 hours
  
  # Resource safeguards
  cpu_threshold_percent: 90       # Pause if CPU exceeds this
  memory_threshold_percent: 90    # Pause if RAM exceeds this
  auto_stop_on_threshold: true    # Stop vs just pause
  
  # Kill switch
  keyboard_killswitch: "ctrl+shift+q"
  mouse_corner_killswitch: true   # Top-left corner for 2 seconds
  
  # Error handling
  max_retry_attempts: 3
  retry_backoff_base: 2           # Exponential: 2s, 4s, 8s

logging:
  level: INFO                     # DEBUG, INFO, WARNING, ERROR
  console_output: true
  file_output: true
  rotate_daily: true
  keep_logs_days: 7
  log_cursor_positions: false     # DEBUG only - logs every position
  log_timing_values: false        # DEBUG only - logs all random values

visual_recognition:
  # Future feature: template matching fallback
  enabled: false
  confidence_threshold: 0.8
  use_ocr_fallback: false

debug:
  dry_run_mode: false             # No actual clicks when true
  visual_overlay: false           # Show click targets on screen
  slow_motion: false              # 0.5x speed for observation
  single_cycle_only: false        # Stop after one loop

# =============================================================================
# Loggy3-specific workflow settings
# =============================================================================
# Cycle overview:
#  1. Focus Loggy3 → click Start
#  2. Click the minimize ("-") icon  ← MINIMIZE_BUTTON_X/Y in .env
#  3. Switch to YouTube web-app
#  4. Wait ~130 seconds (watch_duration_mean above)
#  5. Restore Loggy3 from taskbar (wmctrl / xdotool)
#  6. Click Stop  ← STOP_BUTTON_X/Y in .env
#  7. Short cooldown, then repeat
# The cycle runs endlessly until Ctrl+Shift+Q or mouse corner kill-switch.
loggy3:
  # Extra settle time (s) after Loggy3 finishes uploading before next Start
  post_stop_settle: 3.0
  # How long to wait for the YouTube video to buffer before the watch timer
  # starts (set to 0 if video is already playing when the bot launches)
  youtube_buffer_wait: 5.0
